name: compiler-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Arturo
        uses: arturo-lang/setup-arturo@v2
        with:
          do: compile
          src: v0.10.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Differential, native, and compatibility checks
        run: make check
      - name: Address and undefined-behavior sanitizers
        if: runner.os != 'Windows'
        run: make sanitize
